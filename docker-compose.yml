services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_PATH: /data/vouchers.db
    expose:
      - "8080"
    volumes:
      - voucher-data:/data
    healthcheck:
      test:
        - CMD
        - wget
        - --quiet
        - --tries=1
        - --output-document=/dev/null
        - http://127.0.0.1:8080/api/health
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:80"
    restart: unless-stopped

  swagger:
    image: swaggerapi/swagger-ui
    environment:
      SWAGGER_JSON: /openapi/openapi.yaml
    ports:
      - "8081:8080"
    volumes:
      - ./openapi/openapi.yaml:/openapi/openapi.yaml:ro
    restart: unless-stopped

volumes:
  voucher-data:
